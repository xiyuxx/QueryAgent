# QueryAgent role-based access config
# Loaded by the MCP server at startup.
# Set QUERYAGENT_ROLES_CONFIG=path/to/this/file when starting the server.

roles:
  # analyst: can query business tables, no salary/contact data
  analyst:
    allowed_tables:
      - customers
      - orders
      - order_items
      - products
      - reviews
    blocked_columns:
      customers:
        - phone
        - email

  # finance: financial tables only, no HR data
  finance:
    allowed_tables:
      - accounts
      - transactions
      - loans
      - credit_cards
    blocked_columns: {}

  # hr: HR tables, salary figures and synthetic national_id are visible
  hr:
    allowed_tables:
      - employees
      - departments
      - salaries
      - attendance
    blocked_columns: {}
    raw_columns:
      employees:
        - national_id

  # logistics: supply chain tables only
  logistics:
    allowed_tables:
      - shipments
      - warehouses
      - carriers
      - delivery_routes
    blocked_columns: {}

  # admin: sees everything, including raw synthetic sensitive fields
  admin:
    blocked_columns: {}
    raw_columns: {}

  # readonly: all business tables visible, sensitive values masked by default
  readonly:
    blocked_columns: {}
    raw_columns: {}

default_role: readonly

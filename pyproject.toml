[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queryagent"
version = "0.1.0"
description = "Text-to-SQL data analysis agent with a self-built eval harness and reliability loop"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "mcp>=1.0,<2.0",
    "python-dotenv>=1.0",
    "sqlglot>=26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.2", "fastembed>=0.3", "numpy>=1.26", "PyYAML>=6.0"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
